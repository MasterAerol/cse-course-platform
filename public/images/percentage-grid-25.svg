<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-five percent grid</title>
  <desc id="desc">A ten by ten grid with exactly twenty-five highlighted squares out of one hundred.</desc>
  <style>
    .background { fill: #f8fafc; }
    .highlight { fill: #2563eb; }
    .grid { stroke: #0f172a; stroke-width: 0.75; }
    .border { fill: none; stroke: #0f172a; stroke-width: 1.5; }
  </style>
  <rect class="background" x="10" y="10" width="100" height="100" rx="2" />
  <g aria-hidden="true">
    <rect class="highlight" x="10" y="10" width="10" height="10" />
    <rect class="highlight" x="20" y="10" width="10" height="10" />
    <rect class="highlight" x="30" y="10" width="10" height="10" />
    <rect class="highlight" x="40" y="10" width="10" height="10" />
    <rect class="highlight" x="50" y="10" width="10" height="10" />
    <rect class="highlight" x="10" y="20" width="10" height="10" />
    <rect class="highlight" x="20" y="20" width="10" height="10" />
    <rect class="highlight" x="30" y="20" width="10" height="10" />
    <rect class="highlight" x="40" y="20" width="10" height="10" />
    <rect class="highlight" x="50" y="20" width="10" height="10" />
    <rect class="highlight" x="10" y="30" width="10" height="10" />
    <rect class="highlight" x="20" y="30" width="10" height="10" />
    <rect class="highlight" x="30" y="30" width="10" height="10" />
    <rect class="highlight" x="40" y="30" width="10" height="10" />
    <rect class="highlight" x="50" y="30" width="10" height="10" />
    <rect class="highlight" x="10" y="40" width="10" height="10" />
    <rect class="highlight" x="20" y="40" width="10" height="10" />
    <rect class="highlight" x="30" y="40" width="10" height="10" />
    <rect class="highlight" x="40" y="40" width="10" height="10" />
    <rect class="highlight" x="50" y="40" width="10" height="10" />
    <rect class="highlight" x="10" y="50" width="10" height="10" />
    <rect class="highlight" x="20" y="50" width="10" height="10" />
    <rect class="highlight" x="30" y="50" width="10" height="10" />
    <rect class="highlight" x="40" y="50" width="10" height="10" />
    <rect class="highlight" x="50" y="50" width="10" height="10" />
  </g>
  <path class="grid" d="M20 10V110 M30 10V110 M40 10V110 M50 10V110 M60 10V110 M70 10V110 M80 10V110 M90 10V110 M100 10V110 M10 20H110 M10 30H110 M10 40H110 M10 50H110 M10 60H110 M10 70H110 M10 80H110 M10 90H110 M10 100H110" />
  <rect class="border" x="10" y="10" width="100" height="100" rx="2" />
</svg>
