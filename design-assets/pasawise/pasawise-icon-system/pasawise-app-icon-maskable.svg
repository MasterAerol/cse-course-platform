<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">PasaWise maskable app icon</title>
  <desc id="desc">PasaWise maskable icon with extra safe-area padding.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="80" x2="920" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071F43"/>
      <stop offset="0.48" stop-color="#0B2F63"/>
      <stop offset="1" stop-color="#1A73D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 468) rotate(90) scale(430)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#DCEBFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="170" y1="430" x2="610" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D89200"/>
      <stop offset="0.55" stop-color="#F4B41A"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <linearGradient id="pageBlue" x1="110" y1="470" x2="610" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7DFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#03142C" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="26" y="26" width="972" height="972" rx="224" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8"/>
  <circle cx="512" cy="468" r="430" fill="url(#glow)"/>

  <g transform="translate(154 144) scale(1.0)" filter="url(#softShadow)">
    <!-- PW monogram, adapted for dark app-icon background -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="M155 68 H329 C424 68 478 119 478 202 C478 287 423 338 329 338 H246 V409 H155 Z M246 145 V262 H325 C371 262 393 240 393 202 C393 165 371 145 325 145 Z"/>
    <path fill="#DCEBFF" d="M299 268 H386 L431 414 L480 304 L530 414 L576 268 H665 L575 510 H495 L480 470 L445 386 L410 470 L395 510 H316 Z"/>

    <!-- Open book -->
    <path fill="#071F43" d="M91 529 C194 505 283 526 360 595 C437 526 526 505 629 529 L612 592 C516 570 435 583 360 640 C285 583 204 570 108 592 Z"/>
    <path fill="#FFFFFF" stroke="#8FC1FF" stroke-width="12" stroke-linejoin="round" d="M354 590 C290 537 219 508 112 516 L132 451 C228 446 299 475 354 526 Z"/>
    <path fill="#FFFFFF" stroke="#8FC1FF" stroke-width="12" stroke-linejoin="round" d="M366 590 C430 537 501 508 608 516 L588 451 C492 446 421 475 366 526 Z"/>
    <path fill="url(#pageBlue)" d="M345 575 C288 535 225 516 138 521 L148 487 C225 487 286 510 345 551 Z"/>
    <path fill="url(#pageBlue)" d="M375 575 C432 535 495 516 582 521 L572 487 C495 487 434 510 375 551 Z"/>
    <path fill="none" stroke="#1A73D9" stroke-width="7" stroke-linecap="round" opacity="0.90" d="M148 539 C218 532 279 550 330 584"/>
    <path fill="none" stroke="#1A73D9" stroke-width="7" stroke-linecap="round" opacity="0.90" d="M572 539 C502 532 441 550 390 584"/>
    <path fill="none" stroke="#5AA6F7" stroke-width="6" stroke-linecap="round" opacity="0.80" d="M160 559 C220 553 273 568 314 594"/>
    <path fill="none" stroke="#5AA6F7" stroke-width="6" stroke-linecap="round" opacity="0.80" d="M560 559 C500 553 447 568 406 594"/>
    <circle cx="360" cy="605" r="23" fill="#071F43"/>

    <!-- Passing/progress check-arrow -->
    <path d="M160 344 L274 438 C335 326 414 218 541 113" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 344 L274 438 C335 326 414 218 541 113" fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M520 96 L586 88 L572 153 Z" fill="url(#gold)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
